name: Build Mi Dia Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MiDia-Android-A1*.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer proyecto Android
        shell: bash
        run: |
          ZIP_FILE="$(ls -t MiDia-Android-A1*.zip | head -1)"
          echo "Usando: $ZIP_FILE"
          rm -rf MiDia-Android-A1
          unzip -q "$ZIP_FILE"
          test -f MiDia-Android-A1/app/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: MiDia-Android-A1
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiDia-v1.4-A2-debug
          path: MiDia-Android-A1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
